# Clauder Worker. Secrets (HOOK_TOKEN, FCM_SERVICE_ACCOUNT) are set by the Worker workflow,
# never in this file.
name = "clauder"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true

# Workers AI reads whether a turn's last reply asks the user something (src/ask.ts).
[ai]
binding = "AI"

[observability]
enabled = true

[[durable_objects.bindings]]
name = "SPIKE_LOG"
class_name = "SpikeLog"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SpikeLog"]

[[durable_objects.bindings]]
name = "SESSION"
class_name = "Session"

[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Session", "Hub"]
