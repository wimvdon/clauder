# Checks the Cloudflare Worker (type check + tests) and deploys it from main.
name: Worker

on:
  pull_request:
    paths: ["worker/**", "hooks/**", ".claude/**", ".github/workflows/worker.yml"]
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/worker.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: worker

jobs:
  check:
    name: Type check and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Validate the hook snippet
        working-directory: hooks
        run: |
          python3 -m json.tool settings.json > /dev/null
          python3 -m json.tool ../.claude/settings.json > /dev/null
          H="$(mktemp -d)"
          HOME="$H" bash install-user-hooks.sh
          HOME="$H" bash install-user-hooks.sh
          python3 -c "import json,sys; h=json.load(open(sys.argv[1]))['hooks']; assert all(len(v)==1 for v in h.values()) and len(h)==7, h" "$H/.claude/settings.json"

  deploy:
    name: Deploy to Cloudflare
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HOOK_TOKEN: ${{ secrets.CLAUDER_HOOK_TOKEN }}
      FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - name: Deploy (skipped until the Cloudflare secrets exist)
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; not deploying."
            exit 0
          fi
          npx wrangler deploy
          if [ -n "$HOOK_TOKEN" ]; then
            printf '%s' "$HOOK_TOKEN" | npx wrangler secret put HOOK_TOKEN
          fi
          if [ -n "$FCM_SERVICE_ACCOUNT" ]; then
            printf '%s' "$FCM_SERVICE_ACCOUNT" | npx wrangler secret put FCM_SERVICE_ACCOUNT
          fi
